global:
  scrape_interval: 5s # PoC için hızlı veri (Prod: genelde 15s veya 30s)

scrape_configs:
  # 1. Prometheus kendini izlesin
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Sunucu verilerini topla (Docker service name kullanılır)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # 3. Spring Boot Uygulamasını topla
  - job_name: 'spring-app'
    metrics_path: '/actuator/prometheus' # Spring Boot standart path'i
    static_configs:
      - targets: ['spring-app:8080']