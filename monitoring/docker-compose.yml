services:
  # 1. METRİK TOPLAYICI VE SAKLAYICI
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus # Veriler container silinse de kalsın
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d' # Veriyi 15 gün sakla
    ports:
      - "9090:9090"
    networks:
      - monitoring

  # 2. SUNUCU METRİKLERİ (HOST AGENT)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro # Host'un işlem bilgilerini okur
      - /sys:/host/sys:ro   # Host'un sistem bilgilerini okur
      - /:/rootfs:ro        # Disk doluluk oranları için
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring

  # 3. GÖRSELLEŞTİRME
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana # Dashboardlar silinmesin
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # İlk girişte şifre
    ports:
      - "3000:3000"
    networks:
      - monitoring

  # 4. SENİN UYGULAMAN (Simülasyon için Dockerize edilmeli)
  spring-app:
    build: ../monitoring # Dockerfile'ının olduğu yer
    container_name: monitoring-app
    ports:
      - "8080:8080"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring:
    driver: bridge